name: C++ CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  sim-only:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libeigen3-dev libyaml-cpp-dev zlib1g-dev libzmq3-dev
      - uses: actions/cache@v4
        with:
          path: ~/.cache/boltrt/downloads
          key: native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('dependencies.lock.json', 'tools/fetch-deps.sh') }}
      - name: Native dependencies (no hardware SDKs)
        run: ./tools/fetch-deps.sh --sim-only
      - run: cmake --preset ci
      - run: cmake --build --preset ci --parallel 2
      - run: ctest --preset ci
